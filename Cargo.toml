[package]
name = "claude-statusline"
version = "0.1.0"
edition = "2024"
description = "One-row Claude Code status line"
repository = "https://github.com/svicervlad/claude-statusline"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
gix = { version = "0.90.0", default-features = false, features = ["status", "sha1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "z"     # optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true        # no debug symbols in release
